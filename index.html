["Unit 1 · Reasons to Learn English",["Job opportunities: English is the global language of business, used in international corporations.","Communication with people from many countries and cultures.","Travel: spoken in many tourist destinations.","Information: the primary language of the internet.","Education: many universities and journals publish in English.","Entertainment: film, music and TV.","Cultural understanding of English-speaking societies.","Cognitive development: a second language improves memory and problem-solving.","Confidence in social and professional settings.","A valuable life skill that opens many doors and lasts a lifetime."]],
["Unit 2 · Classroom Language",["Opening the lesson: “Good morning, everybody.” “Hello, everyone.” “How are you today?” “How are things with you?”","Getting contributions: “What should we write?” “What do you think makes sense?” “Do you have a suggestion?” “We haven’t heard from you yet.”","Praise and error correction: “That’s very good.” “Well done.” “Marvelous!” “You did a great job.” “Magnificent!”"]],
["Unit 3 · General & Specific Aims",["Two general aims: (A) learning the language; (B) applying it, mainly expressing thoughts in speech and writing.","Teaching aims: the student understands spoken English, speaks comprehensibly, reads and comprehends, writes with logical cohesion.","College level: understand spoken English and media; speak simply, correctly and fluently; read at reasonable speed; pronounce correctly; produce simple meaningful sentences.","Also: join conversations, write correctly at reasonable speed, comprehend passages, take and make notes, build vocabulary, answer open-ended exam questions."]],
["Unit 4 · Benefits of English as a Second Language",["Globalization makes speaking English more and more critical; it is a prerequisite for career progress.","Better job: expands employment opportunities and gives access to international markets.","English skills on your CV make recruiters take notice; multinationals look for proficiency.","Communication skills: there is a direct correlation between how we communicate and overall success.","Practice conversation and read literature to improve.","Understand other cultures and build a global perspective; fosters trust and appreciation.","Makes travel easier and gives a competitive edge in school or college applications."]],
["Unit 5 · Cognitive Principles (Brown)",["Learning a language means learning to communicate through it. Brown’s principles cover cognitive, affective and linguistic domains.","“Cognitive” because learning is the result of mental activity.","Automaticity: using language for real communication without thinking much about its forms.","Anticipation of Rewards: humans act because of an expected reward; rewards reinforce positive behavior and strengthen self-esteem.","Intrinsic Motivation: stronger motivation gives more power, enthusiasm and passion.","Strategic Investment: success depends on time, effort and attention the student invests.","Autonomy: success depends on independent ability to learn, with or without a teacher.","Language Ego: a second identity may cause confusion; teachers need patience and understanding.","Willingness to Communicate: successful learners believe in themselves and have the courage to use the language."]],
["Unit 6 · Computer Science in English",["Why in demand: bright career prospects; skills like programming, problem-solving, leadership; used from schools to hospitals and finance.","Positions: Systems Analyst, Web Developer, Finance Programmer, Software Engineer, Product Manager, Game Developer.","1. Excellent graduate prospects: a constantly growing job market.","2. Earn big bucks: demand from data science, big data, AI and machine learning; jobs in every field.","3. Global career opportunities: a majority of opportunities overseas.","4. Earning while studying: an advantage over other engineers.","Programs: agile learning, campus placement, industry visits, guest lectures."]]];
const F=[["Automaticity","Using language for real communication without thinking much about its forms."],["Anticipation of Rewards","Humans act because of an expected reward; rewards reinforce positive behavior and build self-esteem."],["Intrinsic Motivation","The stronger the motivation, the greater the power, enthusiasm and passion to reach the goal."],["Strategic Investment","Success depends on the time, effort and attention students devote to learning."],["Autonomy","Success depends on the learner’s independent ability; active inside and outside class, with or without a teacher."],["Language Ego","A second identity (thinking, feeling, acting) may confuse learners; teachers must show patience."],["Willingness to Communicate","Successful learners believe in themselves and have the courage to use the language."],["Why “cognitive” principles?","Because learning is the result of mental activity."],["Brown’s three domains","Cognitive, affective and linguistic."],["Two general aims of learning English","(A) Learning the language; (B) applying it, expressing thoughts in speech and writing."],["Four teaching aims","Understand spoken English; speak comprehensibly; read and comprehend; write with logical cohesion."],["Global language of business","English"],["Primary language of the internet","English: most online content is in it."],["What a second language improves","Memory and problem-solving abilities."],["English on your CV","Makes recruiters take notice; multinationals look for proficiency."],["Communication and success","There is a direct correlation."],["Ways to improve language skills","Practice conversational situations and read literature."],["Why CS is in demand","Bright career prospects; skills in programming, problem-solving, leadership."],["CS positions","Systems Analyst, Web Developer, Finance Programmer, Software Engineer, Product Manager, Game Developer."],["Why engineers earn big","Evolution of data science, big data, AI and machine learning."],["still / ence and understanding to contain emotions."],["Unit 5","Successful language learners believe in their inability to communicate.",T,1,"Willingness to Communicate: they believe in themselves."],["Unit 5","A second identity is a way of thinking, feeling and acting tied to the second language.",T,0,"That is Language Ego."],["Unit 6","Students choose Computer Science because of the bright career ___.",["aims","targets","objectives","prospects"],3,"Unit 6 opening."],["Unit 6","Computer Science students have greater chances of being ___ employed.",["especially","particularly","professionally","generally"],2,"Excellent graduate prospects."],["Unit 6","Computers and computer scientists have gone local now.",T,1,"They have gone global."],["Unit 6","Computer Science engineers have a disadvantage over other engineers.",T,1,"They have an advantage: earning while studying."],["Exam","John moved to London 10 years ago and he ___ lives there.",["yet","always","still","already"],2,"still = continuing situation."],["Exam","His resignation hasn’t been officially announced ___.",["yet","already","always","sometimes"],0,"yet goes with negatives."],["Exam","If you revise for the exam, you ___ pass it.",["could","should","would","will"],3,"First conditional uses will."],["Exam","John rarely sees Paul ___ they live in the same town.",["if not","in spite of","if","although"],3,"although + clause."],["Exam","The First Industrial Revolution used water and ___ power.",["team","steam","cream","beam"],1,"Steam power."],["Exam","In spite of earning a low salary, Linda gave money to her parents.",T,0,"Correct use of in spite of + -ing."]];
const C=[["Essay","Explain how Automaticity and Willingness to Communicate work together in a classroom for first-year computer students.","Automaticity means using English in real communication without consciously thinking about forms. Willingness to Communicate gives learners the courage to try. Together: the more a student dares to speak, the more fluent and automatic the language becomes, so teachers should create frequent low-risk speaking tasks."],["Scenario","A student is afraid to speak because he feels like a different person in English. Which Brown principle is this and how should the teacher respond?","Language Ego. The learner develops a second identity and may feel confused. The teacher should show patience and understanding and help contain emotions."],["Essay","Argue why English is essential for a future computer teacher (use Units 1, 4 and 6).","English is the internet’s main language, the language of business and of most academic material; it widens job opportunities, gives access to international markets and overseas careers, and CVs with English attract recruiters. It also lets a teacher deliver CS content and read industry resources."],["Scenario","A teacher wants students to share ideas but they stay silent. Write three phrases from classroom language she could use.","“Do you have a suggestion?” “What do you think makes sense?” “We haven’t heard from you yet.”"],["Grammar","Choose still, yet or already: “The lesson hasn’t started ___.” and “She ___ lives in Mansoura.” Explain.","yet (negative, not happened until now); still (a situation that continues)."],["Grammar","Combine: “She was tired. She finished the project.” using although and in spite of.","Although she was tired, she finished the project. / In spite of being tired, she finished the project."],["Critical","Which Unit 3 aims are hardest for you, and which Unit 5 principle could help?","Sample: speaking fluently. Strategic Investment (daily time and effort) and Autonomy (practice without a teacher) help most. Support with concrete habits."],["Essay","Write a short paragraph: “Why is Computer Science in demand?”","Students choose Computer Science for bright career prospects. They learn programming, problem-solving and leadership. From schools to hospitals, it has a role everywhere, and AI and big data keep demand high."]];

const UE=["Imagine English as a key. Around the world it is the language of business, the internet, universities, films and travel. If you know it, you can get better jobs, read most online information, study from international sources, talk to people everywhere and feel more confident. Studies also show that learning a second language trains your memory and problem-solving. That is why the unit ends by calling English a smart choice for life.","Classroom language means the ready-made sentences a teacher uses in class. Every lesson has stages: the teacher greets the class (Good morning, everybody), asks how students are (How are you today?), invites ideas (What should we write? Do you have a suggestion?) and encourages quiet students (We haven’t heard from you yet). When students do well, the teacher praises them (Well done. Marvelous!). Learning these sentences helps you teach in English.","‘Aims’ means goals. Learning English has two big goals: (A) learn the language itself and (B) use it to express your ideas in speech and writing. In class, teachers want students to understand spoken English, speak so others understand, read and understand texts, and write clearly and logically. At college level this becomes eleven practical abilities, such as pronouncing words correctly, taking notes, building vocabulary and answering open-ended exam questions in English.","This unit explains why English is useful beyond school. Because the world is globalized, employers want English: it helps you find better jobs, reach international markets and impress recruiters when it appears on your CV. It also improves communication, which is directly linked to success in life. You improve by practicing conversation and reading literature. It also helps you understand other cultures, build trust, travel more easily and enjoy movies and books.","This unit is about HOW people learn a language, using Brown’s principles. They are called ‘cognitive’ because learning happens in the mind. Seven ideas: use English automatically without thinking about grammar (Automaticity); expect rewards that motivate you (Anticipation of Rewards); have inner motivation (Intrinsic Motivation); invest time and effort (Strategic Investment); learn on your own (Autonomy); cope with the feeling of a ‘second identity’ (Language Ego); and have the courage to speak (Willingness to Communicate).","Computer Science graduates are in high demand because every field, from schools to hospitals and banks, needs software. Students learn programming, problem-solving and leadership, and can work as systems analysts, web developers, software engineers, game developers and more. Five benefits: excellent graduate prospects, high pay thanks to AI and big data, jobs overseas, earning while studying, and programs such as industry visits and campus placement. English makes you part of this global field."];
const UEA=["تخيّل أن الإنجليزية مفتاح: هي لغة الأعمال والإنترنت والجامعات والأفلام والسفر حول العالم. إذا أتقنتها تجد وظائف أفضل، وتقرأ معظم المعلومات على الإنترنت، وتدرس من مصادر عالمية، وتتواصل مع الناس في كل مكان، وتزيد ثقتك بنفسك. كما تثبت الدراسات أن تعلم لغة ثانية يقوّي الذاكرة وحل المشكلات. لذلك تنتهي الوحدة بأن تعلمها خيار ذكي مدى الحياة.","لغة الفصل هي الجمل الجاهزة التي يستخدمها المعلم داخل الحصة. لكل حصة مراحل: يحيّي المعلم الطلاب (Good morning, everybody)، ويسألهم عن حالهم (How are you today?)، ثم يطلب أفكارهم (What should we write?)، ويشجع الطالب الهادئ (We haven’t heard from you yet). وعند الإجابة الجيدة يمدحهم (Well done. Marvelous!). حفظ هذه الجمل يساعدك على التدريس بالإنجليزية.","«الأهداف» تعني ما نريد تحقيقه. لتعلم الإنجليزية هدفان كبيران: (أ) تعلم اللغة نفسها، (ب) استخدامها للتعبير عن أفكارك كلاماً وكتابة. وفي الفصل يريد المعلم أن يفهم الطالب المنطوق، ويتحدث بوضوح، ويقرأ ويفهم، ويكتب بشكل منطقي. وعلى مستوى الكلية تصبح 11 قدرة عملية مثل النطق الصحيح وتدوين الملاحظات واكتساب المفردات والإجابة عن الأسئلة المفتوحة بالإنجليزية.","تشرح الوحدة فائدة الإنجليزية خارج المدرسة. مع العولمة يطلبها أصحاب العمل: فهي تساعدك على وظيفة أفضل والوصول للأسواق الدولية وجذب انتباه المجنِّدين عند وجودها في سيرتك الذاتية. وتحسّن التواصل المرتبط مباشرة بالنجاح في الحياة، وتتطور بممارسة المحادثة وقراءة الأدب. كما تساعدك على فهم الثقافات وبناء الثقة وتسهيل السفر والاستمتاع بالأفلام والكتب.","تتناول الوحدة كيف يتعلم الناس اللغة وفق مبادئ براون. وتسمى «معرفية» لأن التعلم يحدث في العقل. سبعة مبادئ: استخدام اللغة تلقائياً دون التفكير في القواعد (التلقائية)، وتوقع مكافآت تحفّزك، ودافع داخلي، واستثمار وقتك وجهدك، والتعلم باستقلالية، والتعامل مع إحساس «الهوية الثانية» (الأنا اللغوية)، والشجاعة في الكلام (الرغبة في التواصل).","خريجو علوم الكمبيوتر مطلوبون لأن كل مجال، من المدارس إلى المستشفيات والبنوك، يحتاج برمجيات. يتعلم الطالب البرمجة وحل المشكلات والقيادة، ويعمل محلل أنظمة أو مطور ويب أو مهندس برمجيات أو مطور ألعاب. وخمس فوائد: آفاق ممتازة للخريجين، ورواتب عالية بفضل الذكاء الاصطناعي والبيانات الضخمة، وفرص في الخارج، والكسب أثناء الدراسة، وبرامج كزيارات صناعية وتدريب. وإتقان الإنجليزية يجعلك جزءاً من هذا المجال العالمي."];
const GL=[[["Proficiency","Being good at a language.","إجادة اللغة بمستوى جيد."],["Insight","Deep understanding of something.","فهم عميق لشيء ما."],["Boost","To increase or improve.","يزيد أو يحسّن."],["Global language","A language used all over the world.","لغة تُستخدم حول العالم."]],[["Contribution","An idea a student gives.","فكرة يقدمها الطالب."],["Error correction","Fixing students’ mistakes politely.","تصحيح أخطاء الطلاب بلطف."],["Marvelous","Wonderful (praise).","رائع (عبارة مدح)."],["Classroom language","Sentences teachers use in class.","جمل يستخدمها المعلم في الفصل."]],[["Aim","A goal you want to reach.","هدف تريد تحقيقه."],["Comprehend","To understand.","يفهم."],["Cohesion","Ideas linked logically.","ترابط الأفكار منطقياً."],["Open-ended question","A question needing a full written answer.","سؤال يحتاج إجابة مكتوبة كاملة."]],[["Prerequisite","Something required first.","شيء مطلوب أولاً."],["Correlation","A link between two things.","علاقة بين شيئين."],["Competitive edge","An advantage over others.","ميزة على الآخرين."],["Lucrative","Paying a lot of money.","مُربح مادياً."]],[["Cognitive","Related to mental activity.","متعلق بالنشاط العقلي."],["Autonomy","Learning independently.","التعلم باستقلالية."],["Reinforcement","Strengthening a behavior, often with a reward.","تقوية سلوك غالباً بالمكافأة."],["Self-concept","How you see yourself.","نظرتك لنفسك."]],[["Discipline","A field of study.","مجال دراسي."],["Prospects","Future chances.","فرص مستقبلية."],["Big data","Huge amounts of data analyzed by computers.","كميات ضخمة من البيانات."],["Placement","Being placed in a job through the college.","التوظيف عبر الكلية."]]];

const SRC=[["Automaticity: This principle states that learning a second language involves automating the use of language where language is used for real communication without having to think too much about the forms of the language itself.","The Anticipation of Rewards: According to this principle, humans universally have an urge to act or behave because of a reward, which will be obtained as a result of their actions or behavior. Giving rewards provides reinforcement for positive behavior, strengthens self-esteem and student self-concept.","Every human activity that is carried out to achieve a goal requires a power boost in the form of motivation. The stronger the motivation, the greater the power, enthusiasm, and passion to achieve the goal. A person’s language ability and development is strongly influenced by the strength of his motivation.","Strategic Investment: The success of student depends on the role of the students themselves in the learning process, how much time, effort, and attention is devoted to the learning process.","Autonomy: This principle states that the success of mastering a foreign language depend on the learner’s autonomous ability to learn a language. Meaning that he participates actively in the classroom and outside the classroom, whether there is a teacher or no teacher.","Language Ego: According to this principle, when a person learns to use a second language, he may be confused because he develops a second identity (way of thinking, feeling, and acting) related to the second language he uses. In this case, teachers need to clarify that patience and understanding are needed to contain their emotions so as to facilitate the process of mastering the second language.","Willingness to Communicate: Successful language learners believe in themselves in terms of their capacity to communicate, so they have the courage and will to use the target language, both productively and receptively."],["1) Increased Job Opportunities: English is the global language of business and is widely spoken in international corporations, making it a valuable skill for job seekers.","2) Improved Communication: Learning English allows individuals to communicate with a wider range of people from different countries and cultures.","3) Enhanced Travel Experience: Knowing English can make traveling abroad much easier, as it is spoken in many tourist destinations.","4) Access to a Wealth of Information: English is the primary language of the internet, with the majority of online content being in English.","5) Improved Educational Opportunities: Many universities and academic journals publish their material in English, making it essential for students and researchers.","6) Better Entertainment: English is the primary language of film, music, and television, allowing individuals to enjoy a wider range of entertainment.","8) Improved Cognitive Development: Learning a second language has been shown to improve memory and problem-solving abilities.","9) Increased Confidence: Being able to speak and understand English can boost an individual’s confidence in social and professional settings."],["Excellent Graduate Prospects: The job market for computer engineers is constantly growing and Computer Science students have greater chances of being professionally employed.","Earn Big Bucks: Computer engineers are in demand these days with the evolution of data science, big data, artificial intelligence and machine learning. Jobs of Computer Science exist in all other fields be it education, health, finance, trading, science, engineering or transport. Software are being designed for each field.","Global Career Opportunities: Computers and computer scientists have gone global now. It needs no reflection that those who study Computer Science get a majority of career opportunities overseas.","Earning while studying: Computer Science engineers have an advantage over other engineers as they can earn while they study.","Computer Science and Engineering courses have gained potential which put students in various positions- Systems Analyst, Web Developer, Finance Programmer, Software Engineer, Product Manager, Game Developer, and many more.","Studying computer science from a renowned college comes with a range of opportunities for the students such as agile learning, campus placement, industry visits, guest lectures, and much more."],["3) What the teacher says at the beginning of the lesson: 1-Good morning, everybody. 2-Hello, everyone.","3-How are you? 4-How are you today? 5-How are you getting on? 6-How are things with you?","4) What the teacher says when getting contributions: 1- What should we write? 2-What do you think makes sense? 3- Do you have a suggestion?","4-We haven’t heard from you yet.","What we say: Classroom Language: The language of error correction. That’s very good. Well done. Very fine. That’s nice. I like that. Marvelous!","You did a great job. Magnificent! Good Luck"],["There are two general aims of learning the English language: (A) Learning the language,","(B) Applying the language and doing something with it, mainly expressing one’s thoughts in speech as well as in writing.","1- To understand spoken English with ease and to understand English from media.","2- To speak simple English correctly and fluently.","3- To read English comprehension at a reasonable speed.","d) Write English with logical cohesion. / 7- To write correctly at a reasonable speed.","4- To pronounce the words correctly so as to decode by others.","9-To have the ability to note-making and note-taking."],["1-Learning English can help you get a better job. 2-In the modern global economy, learning English can be an invaluable asset in helping you to get a better job. With a basic ability to speak and read the language, you will vastly expand your employment opportunities, unlocking positions that would otherwise be out of reach.","3-English is also one of the most widely spoken languages in the world, giving you access to international markets.","4-Additionally, having English skills listed on your CV can make recruiters take notice – many multinationals and organizations look for individuals who have a good level of proficiency.","5-It can improve your communication skills. There is a direct correlation between the way we communicate and our overall success in life.","6-Additionally, reading literature is another natural way to develop these skills. You can tailor your vocabulary by understanding diverse terminology or simply become accustomed to new phrasings that you can use in everyday speaking.","It can help you understand other cultures. Learning about other cultures is an invaluable part of developing a global perspective.","8-It fosters greater trust, and appreciation, and ultimately empowers us all when faced with navigating differences between one another.","9-It can make traveling easier. It can also make traveling easier and give you a competitive edge in school or college applications."]];

const UX=[["Key vocab: global language, wealth of information, insight, boost, proficiency.","Know all 10 reasons; the conclusion: learning English is a smart choice.","Typical questions: why job seekers need English; what a second language improves (memory, problem-solving).","Trap: “English closes doors” is False; it opens them."],["Three situations: opening the lesson, getting contributions, praising.","Opening: Good morning, everybody. How are you getting on?","Praise: Well done. Marvelous! Magnificent! You did a great job.","Expect a short open-ended paragraph on one of these situations."],["Two general aims plus four teaching aims: understand, speak, read, write.","11 college aims: understand, speak, read, pronounce, produce, converse, write, comprehend, take notes, acquire vocabulary, answer open-ended questions.","Traps: “only objective questions” and “with difficulty” are False.","Open-ended: Aims of learning and teaching English at college level."],["Nine benefits: job, markets, CV, communication, literature, cultures, trust, travel, competitive edge.","Key phrases: direct correlation; global perspective; prerequisite.","Traps: “least spoken language” and “only personal relationships” are False.","Short essay: importance of English in a globalized world."],["Seven principles; Brown’s three domains: cognitive, affective, linguistic.","Rewards build self-esteem; Strategic Investment = time, effort, attention.","Traps: suppress emotions, inability to communicate, lack of courage are all False.","Open-ended: Learning English and the anticipation of reward."],["Why demand: bright prospects, technical skills, a role everywhere.","Six job titles and the five benefits (prospects, big bucks, global, earn while studying, programs).","Traps: “gone local”, “disadvantage”, “software for media” are False.","Open-ended: Why is Computer Science in demand? Earn Big Bucks."]];
const UXA=[["مفردات: global language, wealth of information, insight, boost, proficiency.","احفظ الأسباب العشرة؛ والخلاصة: تعلم الإنجليزية خيار ذكي.","أسئلة متوقعة: لماذا يحتاجها الباحث عن عمل؟ وماذا تحسّن اللغة الثانية؟ (الذاكرة وحل المشكلات).","فخ: «الإنجليزية تغلق الأبواب» خطأ؛ فهي تفتحها."],["ثلاثة مواقف: بداية الحصة، طلب المشاركة، المدح.","البداية: Good morning, everybody. How are you getting on?","المدح: Well done. Marvelous! Magnificent! You did a great job.","توقع فقرة قصيرة مفتوحة عن أحد هذه المواقف."],["هدفان عامان وأربعة أهداف تدريس: يفهم، يتحدث، يقرأ، يكتب.","11 هدفاً للكلية: الفهم، الحديث، القراءة، النطق، إنتاج الجمل، المحادثة، الكتابة، فهم المقاطع، تدوين الملاحظات، المفردات، الأسئلة المفتوحة.","فخاخ: «أسئلة موضوعية فقط» و«بصعوبة» خطأ.","سؤال مفتوح: أهداف تعلم وتدريس الإنجليزية على مستوى الكلية."],["تسع فوائد: وظيفة، أسواق، سيرة ذاتية، تواصل، أدب، ثقافات، ثقة، سفر، ميزة تنافسية.","عبارات مهمة: direct correlation؛ global perspective؛ prerequisite.","فخاخ: «أقل اللغات انتشاراً» و«للعلاقات الشخصية فقط» خطأ.","مقال قصير: أهمية الإنجليزية في عالم معولم."],["سبعة مبادئ؛ مجالات براون: معرفي، عاطفي، لغوي.","المكافآت تبني احترام الذات؛ الاستثمار الاستراتيجي = وقت وجهد وانتباه.","فخاخ: كبت المشاعر، عدم القدرة على التواصل، قلة الشجاعة: كلها خطأ.","سؤال مفتوح: تعلم الإنجليزية وتوقع المكافأة."],["سبب الطلب: آفاق مشرقة ومهارات تقنية ودور في كل مكان.","ست وظائف وخمس فوائد (آفاق، أموال، عالمية، الكسب أثناء الدراسة، البرامج).","فخاخ: «أصبحت محلية» و«عيب» و«برامج للإعلام» خطأ.","سؤال مفتوح: لماذا علوم الكمبيوتر مطلوبة؟ Earn Big Bucks."]];const tr=(e,a)=>L=='ar'?a:e;

const UA=[["فرص عمل أكثر: الإنجليزية لغة الأعمال العالمية في الشركات الدولية.","تواصل مع أشخاص من بلدان وثقافات مختلفة.","سفر أسهل: يُتحدث بها في وجهات سياحية كثيرة.","معلومات: اللغة الأساسية للإنترنت.","تعليم: جامعات ومجلات كثيرة تنشر بها.","ترفيه: الأفلام والموسيقى والتلفزيون.","فهم ثقافي لمجتمعات الدول الناطقة بالإنجليزية.","تطور معرفي: لغة ثانية تحسّن الذاكرة وحل المشكلات.","ثقة أكبر في البيئات الاجتماعية والمهنية.","مهارة حياتية تفتح أبواباً كثيرة وتدوم مدى الحياة."],["بداية الحصة: Good morning, everybody. / Hello, everyone. / How are you today? / How are things with you?","طلب المشاركة: What should we write? / What do you think makes sense? / Do you have a suggestion? / We haven’t heard from you yet.","المدح وتصحيح الأخطاء: That’s very good. / Well done. / Marvelous! / You did a great job. / Magnificent!"],["هدفان عامان: (أ) تعلم اللغة، (ب) تطبيقها والتعبير عن الأفكار كلاماً وكتابة.","أهداف التدريس: يفهم الطالب الإنجليزية المنطوقة، يتحدث بوضوح، يقرأ ويفهم المحتوى، يكتب بتماسك منطقي.","على مستوى الكلية: فهم المنطوق والإعلام، التحدث ببساطة وطلاقة، القراءة بسرعة معقولة، النطق الصحيح، تكوين جمل بسيطة ذات معنى.","كذلك: المشاركة في المحادثة، الكتابة الصحيحة، فهم المقاطع، تدوين الملاحظات، اكتساب المفردات، الإجابة عن الأسئلة المفتوحة في الامتحانات."],["العولمة تجعل الإنجليزية أهم فأهم، وهي شرط للتقدم الوظيفي.","وظيفة أفضل: توسع فرص العمل وتتيح الوصول إلى الأسواق الدولية.","إدراجها في السيرة الذاتية يجعل المجنِّدين ينتبهون؛ والشركات متعددة الجنسيات تبحث عن الكفاءة.","مهارات التواصل: توجد علاقة مباشرة بين طريقة تواصلنا ونجاحنا في الحياة.","للتحسن: مارس المحادثة واقرأ الأدب.","فهم الثقافات الأخرى وبناء منظور عالمي، وتعزيز الثقة والتقدير.","تسهّل السفر وتمنح ميزة تنافسية في التقديم للمدارس والكليات."],["تعلم اللغة هو تعلم التواصل بها. مبادئ براون تشمل المجالات المعرفية والعاطفية واللغوية.","سُميت «معرفية» لأن التعلم نتيجة نشاط عقلي.","التلقائية: استخدام اللغة للتواصل الحقيقي دون التفكير كثيراً في أشكالها.","توقع المكافآت: يتصرف الإنسان بسبب مكافأة متوقعة؛ تعزز السلوك الإي ["5","Cognitive Principles (Part 1)","المبادئ المعرفية لتعلم اللغة (الجزء الأول)","The first group of Brown’s cognitive principles that control how a foreign language is acquired and developed.","أول مجموعة من المبادئ المعرفية التي تحكم اكتساب اللغة الأجنبية وتطورها عند المتعلم.",
["Automaticity: reached through repetition and continuous practice.","Anticipation of Reward: people act to reach goals because of rewards. Reinforcement strengthens positive behavior, self-esteem and self-concept (how the student sees his own abilities).","Intrinsic Motivation: a drive from inside the learner that keeps him studying with passion even when tired or busy. The stronger it is, the more enthusiasm and the better the language ability.","Strategic Investment: success depends on the student’s own role: time, effort and attention, even giving up some rest or sleep hours.","Autonomy: mastering the language by learning independently, inside and outside class, with or without a teacher.","Language Ego (intro): using the language is linked to the person’s success and sense of self."],
["التلقائية (Automaticity): تتحقق بالتكرار والممارسة المستمرة.","توقع المكافأة (Anticipation of Reward): يتحرك الإنسان لتحقيق أهدافه بسبب المكافآت. والتعزيز الإيجابي يقوّي السلوك الإيجابي وتقدير الذات (Self-esteem) ومفهوم الذات (Self-concept) أي فهم الطالب لقدراته.","الدافعية الداخلية (Intrinsic Motivation): دافع من داخل المتعلم يجعله يذاكر بحماس وشغف حتى مع التعب أو الانشغال. كلما قوي زاد الحماس وتطورت قدرته اللغوية.","الاستثمار الاستراتيجي (Strategic Investment): نجاح الطالب يعتمد على دوره هو: وقته وجهده وانتباهه، حتى بالتضحية ببعض ساعات الراحة أو النوم.","الاستقلالية (Autonomy): إتقان اللغة بالتعلم المستقل داخل القاعة وخارجها، بوجود معلم أو بدونه.","الأنا اللغوية (Language Ego) تمهيد: ارتباط استخدام اللغة بنجاح الفرد وشعوره بنفسه."]],
["5","Cognitive Principles (Part 2) and Exam Guidance","المبادئ المعرفية (الجزء الثاني) وتوجيهات الامتحانات","Language Ego and Willingness to Communicate, then what kinds of questions to expect for Unit 5.","الأنا اللغوية والرغبة في التواصل، ثم أنواع الأسئلة المتوقعة في الوحدة 5.",
["Second Identity and Language Ego: at an advanced level the learner may feel confused at first, because a second identity develops and his way of thinking, feeling and acting moves closer to native speakers.","Teachers’ role: show patience and understanding to help the learner through this change.","Willingness to Communicate: successful learners believe in their capacity, which gives them the courage and will to use English productively and receptively.","Homework booklet: 10 essay comprehension questions.","10 answered MCQs (e.g. humans act because of a reward; students expect rewards from their actions).","10 answered True/False questions (e.g. giving rewards strengthens the student’s self-concept: True)."],
["الهوية الثانية والأنا اللغوية (Language Ego): عند الوصول لمستوى متقدم قد يشعر المتعلم بالارتباك في البداية لأنه يكوّن هوية ثانية تتغير معها طريقة تفكيره وشعوره وتصرفه لتقترب من أهل اللغة.","دور المعلم: إظهار الصبر والتفهم لتسهيل هذه المرحلة.","الرغبة في التواصل (Willingness to Communicate): المتعلم الناجح يؤمن بقدراته، فيملك الشجاعة والإرادة لاستخدام الإنجليزية إنتاجاً واستقبالاً.","كراسة الواجب: 10 أسئلة فهم مقالية.","10 أسئلة اختيار من متعدد مجابة (مثل: يتصرف البشر بسبب المكافأة، والطلاب يتوقعون مكافآت نتيجة أفعالهم).","10 أسئلة صواب وخطأ مجابة (مثل: تقديم المكافآت يقوّي مفهوم الطالب عن ذاته: صواب)."]],
["6","Benefits of Studying Computer Science in English (Part 1)","فوائد دراسة علوم الكمبيوتر بالإنجليزية (الجزء الأول)","Why Computer Science is in demand, the job titles open to graduates, and the first two of five benefits.","سبب الطلب على علوم الكمبيوتر، والوظائف المتاحة للخريجين، وأول فائدتين من خمس.",
["Combining the technical field with English gives distinctive opportunities.","Technical skills: Programming, Problem Solving, Leadership.","Needed in schools, hospitals and financial companies.","Job titles: Systems Analyst, Web Developer, Financial Programmer, Software Engineer, Product Manager, Game Developer.","Benefit 1, Excellent Graduate Prospects: the job market for computer engineers is constantly growing.","Benefit 2, Earn Big Bucks: good pay thanks to growth in Data Science, Big Data, Artificial Intelligence and Machine Learning."],
["الجمع بين التخصص الفني والإنجليزية يعطي فرصاً متميزة.","المهارات التقنية: البرمجة، حل المشكلات، القيادة.","مطلوبة في المدارس والمستشفيات والشركات المالية.","الوظائف: محلل أنظمة (Systems Analyst)، مطور مواقع (Web Developer)، مبرمج مالي (Financial Programmer)، مهندس برمجيات (Software Engineer)، مدير منتج (Product Manager)، مطور ألعاب (Game Developer).","الفائدة 1، آفاق ممتازة للخريجين (Excellent Graduate Prospects): سوق عمل مهندسي الكمبيوتر ينمو باستمرار.","الفائدة 2، أجور مرتفعة (Earn Big Bucks): مرتبات مجزية بسبب النمو في علوم البيانات والبيانات الضخمة والذكاء الاصطناعي والتعلم الآلي."]],
["6","Benefits of Studying Computer Science in English (Part 2)","فوائد دراسة علوم الكمبيوتر بالإنجليزية (الجزء الثاني)","The last three benefits, the fields that use software, and the Unit 6 exam questions.","آخر ثلاث فوائد، والمجالات التي تستخدم البرمجيات، وأسئلة الوحدة 6.",
["Jobs exist in Education, Healthcare, Finance, Trading, Science, Engineering and Transport, with software designed for each field.","Benefit 3, Global Career Opportunities: computer engineers are in demand internationally, with jobs overseas.","Benefit 4, Earning While Studying: computer students can work and earn during their studies.","Benefit 5, A Range of Programs: Agile Learning, Campus Placement (getting placed in jobs through the college), Industry Visits, Guest Lectures.","Exam: 9 essay comprehension questions, 10 answered MCQs and 10 answered True/False questions to memorize."],
["توجد وظائف في التعليم والصحة والمالية والتجارة والعلوم والهندسة والنقل، وتُصمم برمجيات لكل مجال.","الفائدة 3، فرص عمل عالمية (Global Career Opportunities): مهندسو الكمبيوتر مطلوبون دولياً مع فرص عمل في الخارج.","الفائدة 4، الكسب أثناء الدراسة (Earning While Studying): يستطيع طلاب الكمبيوتر العمل وكسب دخل أثناء الدراسة.","الفائدة 5، تنوع البرامج (A Range of Programs): Agile Learning، وCampus Placement (التوظيف عبر الكلية)، وزيارات الشركات والمصانع (Industry Visits)، ومحاضرات الضيوف (Guest Lectures).","الامتحان: 9 أسئلة فهم مقالية، و10 اختيار من متعدد، و10 صواب وخطأ مجابة للحفظ."]],
["3","Aims of Learning and Teaching English (Part 1)","أهداف تعلم وتدريس الإنجليزية بالجامعة (الجزء الأول)","The difference between the learner’s aims and the teacher’s aims, then college-level aims 1 to 8.","الفرق بين أهداف المتعلم وأهداف المعلم، ثم أهداف المستوى الجامعي من 1 إلى 8.",
["Learner’s aims: speaking, listening, reading and writing correctly and clearly.","Teacher’s aims: qualify the student for spoken understanding, correct speaking, reading with understanding and writing with Logical Cohesion.","1. Understand spoken English with ease, including media.","2. Speak simple English correctly and fluently.","3. Read English comprehension at a reasonable speed.","4. Pronounce words correctly so others can decode them.","5. Produce simple, meaningful sentences.","6. Be engaged in conversations in English.","7. Write correctly at a reasonable speed.","8. Read and comprehend different passages and texts."],
["أهداف المتعلم: التحدث والاستماع والقراءة والكتابة بلغة صحيحة ومفهومة.","أهداف المعلم: تأهيل الطالب للفهم الشفهي والتحدث السليم والقراءة بوعي والكتابة المترابطة منطقياً (Logical Cohesion).","1. فهم الإنجليزية المنطوقة بسهولة وعبر وسائل الإعلام.","2. التحدث بلغة بسيطة وصحيحة وبطلاقة.","3. قراءة قطع الفهم بسرعة معقولة.","4. النطق الصحيح ليفهمه الآخرون (To Decode by Others).","5. كتابة جمل بسيطة ذات معنى.","6. المشاركة في المحادثات بالإنجليزية.","7. الكتابة الصحيحة بسرعة معقولة.","8. قراءة واستيعاب مقاطع ونصوص متنوعة."]],
["3","Aims of Learning and Teaching English (Part 2)","أهداف تعلم وتدريس الإنجليزية (الجزء الثاني): الأهداف 8 إلى 11","Aims 8 to 11: understanding books, note making vs note taking, vocabulary and open-ended questions.","الأهداف من 8 إلى 11: فهم الكتب، وتدوين الملاحظات، والمفردات، والأسئلة المفتوحة.",
["Aim 8 (cont.): understand content and ideas from English books.","Aim 9: Note Making = writing personal notes and summaries from a book or self-reading. Note Taking = writing down points instantly while listening to the doctor’s lecture.","Aim 10, Acquire Vocabulary: build a wide vocabulary for different situations and encounters. Keep reviewing to avoid Language Attrition (forgetting the language).","Aim 11, Answer Open-ended Questions: answer essay questions in exams and express ideas in correct English."],
["تكملة الهدف 8: فهم محتوى وأفكار الكتب الإنجليزية.","الهدف 9: Note Making = صياغة وتلخيص مذكرات شخصية من كتاب أو قراءة ذاتية. Note Taking = تدوين النقاط فوراً أثناء الاستماع لمحاضرة الدكتور.","الهدف 10، اكتساب المفردات (Acquire Vocabulary): حصيلة واسعة من المفردات للمواقف المختلفة، مع المراجعة المستمرة لمنع نسيان اللغة (Language Attrition).","الهدف 11، الإجابة عن الأسئلة المفتوحة (Open-ended Questions): الإجابة عن الأسئلة المقالية في الامتحان والتعبير بإنجليزية صحيحة."]],
["3","Unit 3 Applications and How to Study","الوحدة 3: التطبيقات وطريقة المذاكرة","How to prepare for the final exam and train your speaking.","كيف تستعد للامتحان النهائي وتتدرب على النطق.",
["Prepare 12 to 13 open-ended essay questions, with paragraphs of 3 to 4 sentences for each unit, for the End of Term exam.","Read the unit texts and repeat the sentences aloud at least 5 times a day, to reach correct pronunciation, reasonable speed and Logical Cohesion.","Homework booklet: comprehension questions, 10 MCQs and 10 True/False questions."],
["جهّز 12 إلى 13 سؤالاً مقالياً مفتوحاً، بفقرات من 3 إلى 4 جمل لكل وحدة، لامتحان نهاية الترم.","اقرأ نصوص الوحدة وكرر الجمل بصوت عالٍ 5 مرات يومياً على الأقل للوصول إلى نطق سليم وسرعة معقولة وربط منطقي.","كراسة الواجب: أسئلة فهم، و10 اختيار من متعدد، و10 صواب وخطأ."]],
["4","Benefits of English as a Second Language: Introduction","فوائد الإنجليزية كلغة ثانية: المقدمة والعولمة","Defines a second language and explains why globalization makes English more important.","تعريف اللغة الثانية، وكيف جعلتها العولمة أهم.",
["Unit title: Benefits of Learning English as a Second Language.","Second Language: a language you study and learn to speak fluently alongside your first language (Arabic).","Globalization has made speaking English more and more critical.","For most people English is a Prerequisite for getting ahead in careers.","It also gives many personal benefits, besides the professional ones."],
["عنوان الوحدة: Benefits of Learning English as a Second Language.","اللغة الثانية: لغة تدرسها وتتعلم التحدث بها بطلاقة إلى جانب لغتك الأولى (العربية).","جعلت العولمة التحدث بالإنجليزية أكثر أهمية يوماً بعد يوم (More and More Critical).","هي شرط أساسي (Prerequisite) للتقدم في الوظائف لمعظم الناس.","وتوفر فوائد شخصية بجانب الفوائد المهنية."]],
["4","Professional Benefits 1 to 4","الفوائد المهنية من 1 إلى 4","Better jobs, the global economy, international markets and the CV.","وظيفة أفضل، والاقتصاد العالمي، والأسواق الدولية، والسيرة الذاتية.",
["Benefit 1, Get a Better Job: improves job opportunities in good sectors.","Benefit 2, Invaluable Asset in the Modern Global Economy: reading and speaking skills widen Employment Opportunities and open positions out of reach without English.","Benefit 3, Access to International Markets: one of the most widely spoken languages in the world.","Benefit 4, CV and Recruiters: listing listening, speaking, reading and writing skills attracts recruiters in Multinational Corporations and International Organizations, for Lucrative jobs."],
["الفائدة 1، وظيفة أفضل (Get a Better Job): تحسين الفرص الوظيفية في القطاعات المتميزة.","الفائدة 2، أصل لا يقدر بثمن في الاقتصاد العالمي (Invaluable Asset): مهارات القراءة والتحدث توسع فرص التوظيف وتفتح مناصب بعيدة المنال بدون الإنجليزية.","الفائدة 3، الوصول للأسواق العالمية (Access to International Markets): لأنها من أكثر اللغات انتشاراً.","الفائدة 4، السيرة الذاتية والمجنِّدون (CV and Recruiters): إدراج مهارات الاستماع والتحدث والقراءة والكتابة يجذب باحثي التوظيف في الشركات متعددة الجنسيات والمنظمات الدولية لوظائف مربحة (Lucrative)."]],
["4","Benefit 5: Communication Skills","الفائدة 5: مهارات التواصل","How good communication connects to success in life.","كيف يرتبط التواصل الجيد بالنجاح في الحياة.",
["Improve Communication Skills: there is a Direct Correlation between communication and overall success in life.","It helps build Powerful Connections and Persuasive Arguments, and to Comprehend Complex Topics more easily.","Communicate with Clarity and Brevity, and keep joining different conversation situations to improve listening and speaking."],
